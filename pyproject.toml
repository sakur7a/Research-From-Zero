[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "re0-research"
version = "0.2.0"
description = "An agent-first research workspace with bounded tools and evidence"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
]

[project.scripts]
# One thin entry point. Retrieval and the MCP server live in the package, so the console script
# and the skill wrapper call the same code instead of two copies of it.
re0 = "re0.cli:main"

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["backend"]

# The skill directory ships as data, so a wheel carries it and `re0 skill install --target` works
# from an installed distribution instead of only from a checkout. The list is explicit because TOML
# cannot glob; tests/test_skill_package.py fails when it drifts from the tree, so adding a file here
# is a deliberate act rather than a silent omission from every wheel built afterwards.
[tool.setuptools.data-files]
"share/re0/skills/re0-paper-search" = [
  "skills/re0-paper-search/SKILL.md",
]
"share/re0/skills/re0-paper-search/scripts" = [
  "skills/re0-paper-search/scripts/paper_search.py",
]
"share/re0/skills/re0-paper-search/references" = [
  "skills/re0-paper-search/references/credentials.md",
  "skills/re0-paper-search/references/open-source-status.md",
  "skills/re0-paper-search/references/publication-status.md",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
