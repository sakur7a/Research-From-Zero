[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "re0-research"
version = "0.2.0"
description = "An agent-first research workspace with bounded tools and evidence"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
]

[project.scripts]
# One thin entry point. Retrieval and the MCP server live in the package, so the console script
# and the skill wrapper call the same code instead of two copies of it.
re0 = "re0.cli:main"

[project.optional-dependencies]
test = ["pytest==9.0.2", "build==1.6.1"]
browser-smoke = ["playwright==1.63.0"]
# PDF text extraction. Optional on purpose: an HTML-only read needs nothing beyond the standard
# library, and a PDF backend should be a choice the installer makes rather than a dependency every
# user inherits. pypdf is BSD-3-Clause and pure Python, so it adds no compiled extension. Without
# it a PDF is reported as parser_missing, with the install command, and is never OCR-ed instead.
fulltext = ["pypdf==6.1.1"]

[tool.setuptools.packages.find]
where = ["backend"]

# The skill directory ships as data, so a wheel carries it and `re0 skill install --target` works
# from an installed distribution instead of only from a checkout. The list is explicit because TOML
# cannot glob; tests/test_skill_package.py fails when it drifts from the tree, so adding a file here
# is a deliberate act rather than a silent omission from every wheel built afterwards.
[tool.setuptools.data-files]
"share/re0/skills/re0-paper-search" = [
  "skills/re0-paper-search/SKILL.md",
]
"share/re0/skills/re0-paper-search/scripts" = [
  "skills/re0-paper-search/scripts/paper_search.py",
]
"share/re0/skills/re0-paper-search/references" = [
  "skills/re0-paper-search/references/credentials.md",
  "skills/re0-paper-search/references/open-source-status.md",
  "skills/re0-paper-search/references/publication-status.md",
  "skills/re0-paper-search/references/venue-filter.md",
]

# The browser UI ships the same way the skill does, so an installed wheel can actually serve
# a page. Without this the app resolves `web/` relative to a repository that is not there, and
# create_app fails at startup instead of starting a server with no interface. TOML cannot glob,
# so the list is explicit and `backend/tests/test_paths.py` fails when it drifts from the tree.
"share/re0/web" = [
  "web/agent-core.js",
  "web/agent.css",
  "web/agent.html",
  "web/agent.js",
  "web/api.js",
  "web/app.js",
  "web/core.js",
  "web/favicon.svg",
  "web/icons.js",
  "web/index.html",
  "web/login-core.js",
  "web/login.css",
  "web/login.html",
  "web/login.js",
  "web/search-core.js",
  "web/search.css",
  "web/search.html",
  "web/search.js",
  "web/skill.css",
  "web/skill.html",
  "web/skill.js",
  "web/styles.css",
  "web/theme-bootstrap.js",
  "web/theme.css",
  "web/theme.js",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
