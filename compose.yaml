services:
  re0:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RE0_MODE: hosted
      RE0_SESSION_SECRET: ${RE0_SESSION_SECRET:-}
      RE0_PUBLIC_ENTRY: ${RE0_PUBLIC_ENTRY:-}
      RE0_ALLOWED_ORIGINS: ${RE0_ALLOWED_ORIGINS:-}
      RE0_DB: ${RE0_DB:-/app/.data/re0.sqlite3}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - re0_data:/app/.data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  re0_data:
