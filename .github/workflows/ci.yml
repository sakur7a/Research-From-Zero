name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-15
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
      - run: npm test
      - run: npm run check
      # The smoke builds, inspects and installs both public artifact formats from a clean checkout.
      - run: python scripts/install_smoke.py .data/ci-install-smoke
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-15
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build the pinned container
        run: docker build --tag re0:ci .
      - name: Check production entrypoint, 202 task, report export and ephemeral cold start
        run: python scripts/container_smoke.py re0:ci
      - name: Remove smoke container
        if: always()
        run: docker rm --force re0-hosted-smoke || true
