name: live evals

# Manual only, and deliberately so. The live channel spends real tokens on a real model, so it is
# never triggered by a push or a pull request and a fork cannot reach the secret.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'one task id, or "all" live tasks'
        required: false
        default: all
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-15
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      # Names only reach the log. The runner records which variables were set, never a value.
      - name: run the live channel
        env:
          RE0_LLM_BASE_URL: ${{ secrets.RE0_LLM_BASE_URL }}
          RE0_LLM_MODEL: ${{ secrets.RE0_LLM_MODEL }}
          RE0_LLM_API_KEY: ${{ secrets.RE0_LLM_API_KEY }}
          RE0_LLM_ALLOWED_HOSTS: ${{ secrets.RE0_LLM_ALLOWED_HOSTS }}
        run: |
          if [ -z "$RE0_LLM_BASE_URL" ] || [ -z "$RE0_LLM_MODEL" ]; then
            echo "no model configuration in this repository's secrets; the live channel stays blocked"
            python evals/runner.py --channel live
            exit 0
          fi
          python evals/runner.py --channel live --only "${{ inputs.task }}"
      - name: score the live channel
        env:
          RE0_LLM_BASE_URL: ${{ secrets.RE0_LLM_BASE_URL }}
          RE0_LLM_MODEL: ${{ secrets.RE0_LLM_MODEL }}
          RE0_LLM_API_KEY: ${{ secrets.RE0_LLM_API_KEY }}
        run: python evals/score.py --channel live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-eval-summary
          path: evals/results/SUMMARY.md
